[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbrain"
version = "0.1.0"
description = "A coupled heart-brain dynamical system: a self-sustained oscillator (Van der Pol) coupled to a recurrent neural network."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
experiments = ["matplotlib", "scipy"]
dev = ["pytest"]

# Layout src/: packages live under src/, not in the root directory.
# "setuptools" look for them there instead of the repo root directory.
[tool.setuptools.packages.find]
where = ["src"]
